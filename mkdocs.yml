site_name: bootstrapx
site_description: Production-grade bootstrap uncertainty estimation for Python
site_url: https://artyerokhin.github.io/bootstrapx
repo_url: https://github.com/artyerokhin/bootstrapx
repo_name: artyerokhin/bootstrapx

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Methods: methods.md
  - Integrations: integrations.md
  - A/B Testing: ab-testing.md
  - Time Series: time-series.md
  - API Reference: reference.md
  - Benchmarks: benchmarks.md
  - Changelog: changelog.md