name: Publish to PyPI

on:
  push:
    tags:
      - "v*"  # Запускать только если тег начинается с "v" (например, v0.1.1)

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
          id-token: write
          contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Verify tag matches package version
      shell: bash
      run: |
        tag_version="${GITHUB_REF_NAME#v}"
        package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        test "$tag_version" = "$package_version" || {
          echo "Tag v$tag_version does not match pyproject.toml version $package_version"
          exit 1
        }
        echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

    - name: Verify tagged commit is on main
      run: |
        git fetch origin main
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main

    - name: Verify version is not already published
      run: |
        python - <<'PY'
        import json
        import os
        import urllib.error
        import urllib.request

        version = os.environ["PACKAGE_VERSION"]
        try:
            with urllib.request.urlopen("https://pypi.org/pypi/bootstrapx-lib/json") as response:
                releases = json.load(response)["releases"]
        except urllib.error.HTTPError as error:
            if error.code != 404:
                raise
            releases = {}

        if version in releases:
            raise SystemExit(f"bootstrapx-lib {version} is already published")
        PY

    - name: Install release dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,pandas,sklearn,docs]" build twine

    - name: Verify release candidate
      run: |
        ruff format --check src tests
        ruff check src tests
        pytest --cov=bootstrapx --cov-fail-under=70
        pytest --doctest-modules src/bootstrapx
        mkdocs build --strict

    - name: Build package
      run: |
        python -m build
        twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
