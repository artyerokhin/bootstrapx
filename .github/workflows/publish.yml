name: Publish to PyPI

on:
  push:
    tags:
      - "v*"  # Запускать только если тег начинается с "v" (например, v0.1.1)

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Verify tag matches package version
      shell: bash
      run: |
        tag_version="${GITHUB_REF_NAME#v}"
        package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        test "$tag_version" = "$package_version" || {
          echo "Tag v$tag_version does not match pyproject.toml version $package_version"
          exit 1
        }
        echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

    - name: Verify tagged commit is on main
      run: |
        git fetch origin main
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main

    - name: Check whether version is already published
      run: |
        python - <<'PY'
        import json
        import os
        import urllib.error
        import urllib.request

        version = os.environ["PACKAGE_VERSION"]
        try:
            with urllib.request.urlopen("https://pypi.org/pypi/bootstrapx-lib/json") as response:
                releases = json.load(response)["releases"]
        except urllib.error.HTTPError as error:
            if error.code != 404:
                raise
            releases = {}

        files = releases.get(version, [])
        exists = bool(files)
        if exists:
            filenames = {item["filename"] for item in files}
            if not any(name.endswith(".whl") for name in filenames):
                raise SystemExit(f"Published bootstrapx-lib {version} has no wheel")
            if not any(name.endswith(".tar.gz") for name in filenames):
                raise SystemExit(f"Published bootstrapx-lib {version} has no source distribution")
            print(f"bootstrapx-lib {version} is already complete on PyPI; upload will be skipped")

        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
            env_file.write(f"PYPI_VERSION_EXISTS={'true' if exists else 'false'}\n")
        PY

    - name: Install release dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "numpy<2.3" -e ".[dev,pandas,sklearn,docs]" build twine

    - name: Verify release candidate
      run: |
        ruff format --check src tests
        ruff check src tests
        mypy src
        pytest --cov=bootstrapx --cov-fail-under=85
        pytest --doctest-modules src/bootstrapx
        mkdocs build --strict
        pip check
        python -m compileall -q src/bootstrapx
        python -c "from bootstrapx import bootstrap; import bootstrapx; assert callable(bootstrap); assert bootstrapx.__version__"

    - name: Build package
      run: |
        python -m build
        twine check dist/*

    - name: Publish to PyPI
      if: env.PYPI_VERSION_EXISTS != 'true'
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

    - name: Create or update GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        else
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        fi
