name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

  typing:
    name: Strict typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install typing dependencies
        run: pip install -e ".[dev,pandas,sklearn]"

      - name: Check strict typing
        run: mypy src

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install -e ".[dev,pandas,sklearn]"

      - name: Run tests
        run: pytest

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev,pandas,sklearn]"

      - name: Run tests with coverage
        run: pytest --cov=bootstrapx --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install documentation dependencies
        run: pip install -e ".[docs,pandas,sklearn]" pytest

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Run documentation examples
        run: pytest --doctest-modules src/bootstrapx

  minimum-dependencies:
    name: Minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install minimum core dependencies
        run: |
          pip install "numpy==1.23.5" "scipy==1.10.0" "joblib==1.3.0" "pytest>=7,<8"
          pip install --no-deps -e .

      - name: Test core package without optional dependencies
        run: |
          pytest
          pip check
          python -m compileall -q src/bootstrapx
          python -c "from bootstrapx import *; assert callable(bootstrap); assert __version__"

  package:
    name: Build and install distribution
    needs: [lint, typing, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Install wheel and smoke test
        run: |
          pip install --force-reinstall dist/*.whl
          pip check
          python -c "import bootstrapx, compileall; assert compileall.compile_dir(bootstrapx.__path__[0], quiet=1); print(bootstrapx.__version__)"
