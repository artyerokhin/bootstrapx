name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: pip install ruff

      - name: Check formatting
        run: |
          ruff format --check src tests \
            benchmarks/bench_speed.py \
            benchmarks/bench_coverage_accuracy.py \
            benchmarks/bench_numba.py \
            benchmarks/run_release.py \
            benchmarks/plot_release_results.py \
            benchmarks/bench_two_sample.py \
            benchmarks/bench_two_sample_coverage.py \
            benchmarks/run_comparison_release.py \
            benchmarks/plot_comparison_results.py

      - name: Lint
        run: |
          ruff check src tests \
            benchmarks/bench_speed.py \
            benchmarks/bench_coverage_accuracy.py \
            benchmarks/bench_numba.py \
            benchmarks/run_release.py \
            benchmarks/plot_release_results.py \
            benchmarks/bench_two_sample.py \
            benchmarks/bench_two_sample_coverage.py \
            benchmarks/run_comparison_release.py \
            benchmarks/plot_comparison_results.py

  typing:
    name: Strict typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install typing dependencies
        run: pip install "numpy<2.3" -e ".[dev,pandas,sklearn]"

      - name: Check strict typing
        run: mypy src

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install -e ".[dev,pandas,sklearn]"

      - name: Run tests
        run: pytest

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev,pandas,sklearn]"

      - name: Run tests with coverage
        run: pytest --cov=bootstrapx --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Smoke-test coverage benchmark pipeline
        run: |
          python benchmarks/bench_coverage_accuracy.py --smoke
          python benchmarks/bench_two_sample_coverage.py --smoke

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install documentation dependencies
        run: pip install -e ".[docs,pandas,sklearn]" pytest

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Run documentation examples
        run: pytest --doctest-modules src/bootstrapx

  minimum-dependencies:
    name: Minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install minimum core dependencies
        run: |
          pip install "numpy==1.23.5" "scipy==1.10.0" "joblib==1.3.0" "pytest>=7,<8"
          pip install --no-deps -e .

      - name: Test core package without optional dependencies
        run: |
          pytest
          pip check
          python -m compileall -q src/bootstrapx
          python -c "from bootstrapx import *; assert callable(bootstrap); assert callable(bootstrap_two_sample); assert __version__"

  optional-numba:
    name: Optional Numba acceleration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Numba extra
        run: pip install -e ".[numba]" pytest

      - name: Test accelerated time-series generators
        run: |
          python -c "import numba; print(numba.__version__)"
          pytest tests/test_timeseries.py tests/test_timeseries_hotfix.py
          python benchmarks/bench_numba.py --n-resamples 20 --repeats 1

  package:
    name: Build and install distribution
    needs: [lint, typing, test, optional-numba]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Verify source archive contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archives = list(Path("dist").glob("*.tar.gz"))
          assert len(archives) == 1, f"Expected one sdist, found: {archives}"
          required = {
              "notebooks/04_ab_test_cluster_bootstrap.ipynb",
              "notebooks/06_real_world_ab_hillstrom.ipynb",
              "notebooks/07_product_ab_reference.ipynb",
              "pytest.ini",
              "tests/conftest.py",
          }
          with tarfile.open(archives[0]) as archive:
              names = archive.getnames()
          missing = {path for path in required if not any(name.endswith(path) for name in names)}
          assert not missing, f"Source archive is missing: {sorted(missing)}"
          PY

      - name: Install wheel and smoke test
        run: |
          pip install --force-reinstall dist/*.whl
          pip check
          python -c "import bootstrapx, compileall; assert compileall.compile_dir(bootstrapx.__path__[0], quiet=1); assert callable(bootstrapx.bootstrap_two_sample); print(bootstrapx.__version__)"
