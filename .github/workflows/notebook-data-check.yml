name: Verify real-data notebook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hillstrom:
    name: Execute Hillstrom with verified data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install notebook execution tools
        run: pip install -e ".[pandas]" pytest nbclient nbformat ipykernel matplotlib
      - name: Download, verify and analyze Hillstrom
        env:
          BOOTSTRAPX_RUN_NETWORK_NOTEBOOKS: "1"
          MPLBACKEND: Agg
        run: pytest tests/test_notebook_execution.py -k hillstrom
