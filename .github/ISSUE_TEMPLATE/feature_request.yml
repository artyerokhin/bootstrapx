name: Practitioner workflow request
description: Propose an API or workflow for an applied data-science use case
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Practitioner workflow
      description: What metric or comparison were you trying to estimate?
      placeholder: Compare two models' AUC on repeated observations from the same patients.
    validations:
      required: true
  - type: textarea
    id: data_structure
    attributes:
      label: Data shape and independent unit
      description: Describe the columns and what must stay together in a resample. An anonymized schema is enough; do not attach private records.
      placeholder: One row per visit; patient_id repeats; y_true, score_a and score_b are aligned by visit.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
      description: Show how you solve this today, what is slow or error-prone, and which library you use.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Desired API and output
      description: A short code sketch is helpful but not required.
      render: python
  - type: textarea
    id: assumptions
    attributes:
      label: Statistical assumptions or references
      description: Include pairing, clustering, time dependence, or relevant references if known. It is fine to be unsure.
