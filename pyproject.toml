[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bootstrapx-lib"
version = "0.4.3"
description = "Production-grade bootstrap uncertainty estimation: 16 methods, sklearn CV, pandas accessor."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Artem Erokhin", email = "artyerokhin@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
keywords = [
    "bootstrap", "statistics", "confidence-interval", "resampling",
    "uncertainty", "bca", "time-series", "bayesian-bootstrap",
    "hypothesis-testing", "machine-learning", "data-science",
    "ab-testing", "causal-inference", "econometrics",
    "uncertainty-quantification", "monte-carlo", "sklearn",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
pandas  = ["pandas>=1.5"]
sklearn = ["scikit-learn>=1.2"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "hypothesis",
    "coverage",
    "mypy",
    "ruff",
    "pre-commit>=3",
    "pandas>=1.5",
    "scikit-learn>=1.2",
]
docs  = ["mkdocs-material>=9", "mkdocstrings[python]>=0.24"]
bench = ["asv", "virtualenv"]

[project.urls]
Homepage      = "https://github.com/artyerokhin/bootstrapx"
Documentation = "https://artyerokhin.github.io/bootstrapx"
Repository    = "https://github.com/artyerokhin/bootstrapx"
Issues        = "https://github.com/artyerokhin/bootstrapx/issues"
Changelog     = "https://github.com/artyerokhin/bootstrapx/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version       = "3.10"
warn_return_any      = true
warn_unused_configs  = true
ignore_missing_imports = true
strict               = true

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
addopts    = "--tb=short -q"
